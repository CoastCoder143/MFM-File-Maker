[project]
name = "mfm-file-maker"
version = "1.0.0"
description = "Generate run-specific MIKE FM model files from templates and CSV parameters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CHWY" }
]
keywords = ["mike-fm", "mfm", "modeling", "automation", "dhi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CoastCoder143/Code-Work"
Repository = "https://github.com/CoastCoder143/Code-Work"
Issues = "https://github.com/CoastCoder143/Code-Work/issues"
