[project]
name = "mfm-file-maker"
version = "1.0.0"
description = "Generate run-specific MIKE FM model files from templates and CSV parameters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CHWY" }
]
keywords = ["mike-fm", "mfm", "modeling", "automation", "dhi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CoastCoder143/MFM-File-Maker"
Repository = "https://github.com/CoastCoder143/MFM-File-Maker"
Issues = "https://github.com/CoastCoder143/MFM-File-Maker/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
